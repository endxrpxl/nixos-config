# This machine's entry point into noctalia's config, linked to
# ~/.config/noctalia/config.toml. See hosts/tower.toml for why the shared half is
# included rather than autoloaded.

[include]
files = ["shared/base.toml"]

[hooks]
# Tray apps start here rather than from umbriel's autostart list, which would
# launch them alongside noctalia. Bitwarden registers a tray icon and starts
# minimised, so racing the shell's StatusNotifierWatcher leaves it running with
# no icon and no window. `started` fires after noctalia has initialised, which
# orders it behind the tray host.
#
# setsid detaches the app from noctalia's process group, so restarting the
# shell does not take it down with it.
started = "setsid -f bitwarden"
battery_charging = "noctalia msg power-set performance"
battery_discharging = "noctalia msg power-set balanced"
battery_plugged = "noctalia msg power-set performance"

# No per-surface `monitors` lists: this machine's connectors have never been
# enumerated, and an empty list means "every monitor", which is the right
# default for a single-display machine anyway.

# This machine has a fingerprint reader and tower does not, so this sits here
# rather than in the shared half. On tower it would start a scan for a device
# that will never answer.
#
# Noctalia talks to fprintd over D-Bus directly rather than through PAM, so the
# lock screen needs only the daemon from the `fingerprint` feature module. The
# module's PAM setting covers polkit prompts, not this.
[lockscreen]
fingerprint = true
transition = ["fade"]
