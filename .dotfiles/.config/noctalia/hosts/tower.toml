# This machine's entry point into noctalia's config, linked to
# ~/.config/noctalia/config.toml.
#
# The shared half is included rather than autoloaded, so load order is written
# down instead of following from the alphabetical order of two filenames. The
# include loads first; anything set in this file overrides it.

[include]
files = [ "shared/base.toml" ]

[hooks]
# Tray apps autostart here rather than from niri's spawn-at-startup, which fires
# every entry at once — including noctalia itself. All three of these register a
# tray icon and start minimised, so racing the shell's StatusNotifierWatcher
# leaves them running with no icon and no window. `started` fires after noctalia
# has initialised, which orders them behind the tray host.
#
# setsid detaches each app from noctalia's process group, so restarting the
# shell does not take them down with it.
started = "setsid -f bitwarden; setsid -f discord; setsid -f spotify"

# Surfaces that name a connector, and so can only be set per machine.
[dock]
monitors = [ "DP-3" ]

[lockscreen]
monitors = [ "DP-3" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@HEADLESS-1",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 800.0
    cx = 960.0
    cy = 894.0
    enabled = false
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HEADLESS-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 538.0
    output = "HEADLESS-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HEADLESS-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 512.0
    cx = 1720.0
    cy = 336.0
    output = "DP-3"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true

[notification]
monitors = [ "DP-3" ]

[osd]
monitors = [ "DP-3" ]
