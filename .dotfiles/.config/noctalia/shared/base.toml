# Noctalia settings that hold on every machine. Pulled in by each host's entry
# file; see .dotfiles/.config/noctalia/hosts/.
#
# This lives in a subdirectory on purpose. Noctalia autoloads every *.toml in
# the root of its config directory, so a shared file sitting next to the entry
# file would load twice. Being alphabetically later, it would also override the
# host's values rather than the other way round. Subdirectories are not
# autoloaded, so the only way in is the explicit include, which loads first.
#
# This is the declarative half of noctalia's config. Noctalia never writes back
# here. Everything the settings UI changes lands in
# ~/.local/state/noctalia/settings.toml, which is runtime state and stays out of
# this repo. To keep a setting, copy it across with
# `noctalia config export merged`.
#
# `noctalia config validate` checks this file.

# The look follows Apple's HIG as of macOS 26 Tahoe, minus the glass: solid
# surfaces and borderless controls. Colours come from palettes/apple.json, the
# Apple system colours.

[audio]
enable_sounds = true

# A Tahoe-style menu bar, but opaque: no shadow and no capsules. Its bottom
# corners curve inward where it meets the screen edges.
# Workspaces on the left, the clock centred, status items on the
# right with Control Center last.
[bar.default]
background_opacity = 1.0
capsule = false
center = [ "clock" ]
concave_edge_corners = true
end = [
    "media",
    "tray",
    "keyboard_layout",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "notifications",
    "control-center"
]
font_weight = 500
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
shadow = false
start = [ "workspaces" ]
thickness = 28
widget_spacing = 8

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
auto_locate = true

[nightlight]
enabled = true

[notification]
background_opacity = 1.0
border = false

[osd]
background_opacity = 1.0
border = false

[theme]
custom_palette = "apple"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt", "starship" ]
    community_ids = [
        "opencode",
        "pi-agent",
        "zen-browser",
        "discord",
        "vscode",
        "zed",
        "fastfetch",
        "zathura",
        "whitesur-icons",
        "yazi"
    ]

[wallpaper]
directory = "~/nixos-config/.dotfiles/wallpapers"

    [wallpaper.default]
    path = "/home/ansgar/nixos-config/.dotfiles/wallpapers/daniel-leone.jpg"

# macOS controls are borderless fills, so every outline is off.
[shell]
avatar_path = "~/nixos-config/.dotfiles/avatar.png"
button_borders = false
card_borders = false
corner_radius_scale = 1.4
font_family = "Inter"
input_borders = false
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
polkit_agent = true
popup_borders = false

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    clipboard_position = "auto"
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    transparency_mode = "solid"

    [shell.shadow]
    alpha = 0.35
    direction = "down"

[widget.control-center]
glyph = "home"
