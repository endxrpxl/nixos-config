# Everything in umbriel's configuration that only this machine can know,
# translated from niri's hosts/laptop.kdl. Linked to ~/.config/umbriel/host.toml,
# which the shared config.toml includes after rules.toml and before
# noctalia.toml.
#
# This file can only add keys the shared files do not set: everything in
# config.toml overrides every include.

# The XKB spelling of the `console.keyMap = "de"` in this host's
# configuration.nix. Keep the two in step — neither can be derived from the
# other.
[input.keyboard]
layout = "de"

# niri's `touchpad { tap; natural-scroll; }`. tap is umbriel's default too;
# written out to stay literal.
[input.touchpad]
tap = true
natural_scroll = true

# The three labeled workspaces plus two free spares, as Nerd Font glyphs for
# the labels rather than words — RobotoMono Nerd Font is installed
# (fonts.packages), so the bar and the overview pick the icons up through
# font fallback. The legend:
#   \uF0AC globe     — web:       zen, bitwarden (floating)
#   \uF121 </>       — code:      kitty, zed, emacs
#   \uF086 comments  — chat+media: discord, spotify
#   4, 5             — free:      anything
# The glyphs are the workspace names, unique across outputs on every host,
# so config.toml's Mod+1..3 select them from any monitor by the same
# escapes; rules.toml's window rules land the apps on positions 1..3 and
# never name the workspaces at all. The digits are plain names, so Mod+4 and
# Mod+5 pick the spares by name. Only the list is set: the panel's mode and
# scale are probed, and a single output needs no position. The static list
# replaces the dynamic numbered strip, so there is no trailing empty
# workspace and workspace-next stops at the last label instead of opening a
# fresh one.
[output."eDP-1"]
workspaces = ["\uF0AC", "\uF121", "\uF086", "4", "5"]

# Host-specific because they name a backlight: only a machine with an internal
# panel has one to dim. Both take noctalia's default monitor selector, which
# on this host can only ever mean eDP-1. niri marked these
# allow-when-locked=true, so they are too and stay reachable at a locked
# session.
[keybinds]
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up 5", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down 5", allow_when_locked = true }
