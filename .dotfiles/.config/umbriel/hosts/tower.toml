# Everything in umbriel's configuration that only this machine can know,
# translated from niri's hosts/tower.kdl. Linked to ~/.config/umbriel/host.toml,
# which the shared config.toml includes after rules.toml and before
# noctalia.toml.
#
# This file can only add keys the shared files do not set: everything in
# config.toml overrides every include. The window_rule array at the bottom is
# the one deliberate exception to "only add": umbriel replaces rule arrays
# wholesale when merging includes, so extending the shared rules means
# restating them.

# The XKB spelling of niri's `layout "gb,gb" variant ",intl"`, which itself
# matches this host's `console.keyMap = "uk"`. Keep the two in step — neither
# can be derived from the other.
[input.keyboard]
layout = "gb,gb"
variant = ",intl"

# niri's tower bind: the mute key toggles the *microphone*, not the speakers.
# niri marked it allow-when-locked=true; this umbriel version has no per-bind
# allow-when-locked, so it is an ordinary bind.
[keybinds]
"XF86AudioMute" = "spawn:noctalia msg mic-mute"

# niri's outputs, modes and positions carried over. Umbriel has no
# focus-at-startup; DP-3 stays the primary by position in any case. The
# workspace labels are glyphs — the legend lives in hosts/laptop.toml —
# split the way the old window rules already shelved things: globe and </>
# (web, code) on the ultrawide, comments and music (chat, media) on the
# side screen, so Discord and Spotify keep landing where they always did.
# Static lists mean no trailing empty workspace on either monitor, and
# workspace-next stops at each output's last label.
[output."DP-3"]
mode = "3440x1440@165.001"
scale = 1
position = [0, 1080]
workspaces = ["\uF0AC", "\uF121"]

[output."HDMI-A-1"]
mode = "1920x1080@120.000"
position = [771, 0]
workspaces = ["\uF086", "\uF001"]

# niri's DP-3 `always-center-single-column`; umbriel has no per-output layout
# section, so this applies to both outputs. HDMI-A-1 only ever carries Spotify
# and Discord, so the difference is invisible.
[layout.scrolling]
center_underfull_strip = true

# Host-specific because they name a connector: these rules only mean
# anything on a machine that has a DP-3 and an HDMI-A-1.
#
# This array replaces the shared rules from rules.toml wholesale, so it
# restates them — keep the geometry entries and the app set in step with it.
# The routing rules restate rules.toml's app routing with default_output
# added, because the labels are split across monitors here: default_workspace
# counts positions on the output the rule names, so 1..2 on DP-3 are
# web/code and 1..2 on HDMI-A-1 are chat/media. The layer rules are not
# restated because this file adds none.

# rules.toml's Picture-in-Picture rule, restated.
[[window_rule]]
match.app_id = "^zen$"
match.title = "^Picture-in-Picture$"
default_floating = true

# web, on the ultrawide.
[[window_rule]]
match.app_id = "^zen$"
default_output = "DP-3"
default_workspace = 1

[[window_rule]]
match.app_id = "^bitwarden$"
default_output = "DP-3"
default_workspace = 1

# code, on the ultrawide.
[[window_rule]]
match.app_id = "^kitty$"
default_output = "DP-3"
default_workspace = 2

[[window_rule]]
match.app_id = "^dev\\.zed\\.Zed$"
default_output = "DP-3"
default_workspace = 2

[[window_rule]]
match.app_id = "^emacs$"
default_output = "DP-3"
default_workspace = 2

# chat, on the side screen, where Discord already lived — the old
# output-only rule sent it to HDMI-A-1's active workspace; this one lands
# it on the label.
[[window_rule]]
match.app_id = "^discord$"
default_output = "HDMI-A-1"
default_workspace = 1

# media, on the side screen: Spotify by title, as niri matched it, and VLC.
[[window_rule]]
match.title = "^Spotify$"
default_output = "HDMI-A-1"
default_workspace = 2

[[window_rule]]
match.app_id = "^vlc$"
default_output = "HDMI-A-1"
default_workspace = 2

# rules.toml's catch-all blur, restated.
[[window_rule]]
blur = true
blur_optimized = false
