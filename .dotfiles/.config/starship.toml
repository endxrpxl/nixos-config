palette = "noctalia"
# The prompt format, which used to live in a matugen template. Matugen is gone
# with DMS; noctalia's starship template replaces only the colours.
#
# That template splices a `# >>> NOCTALIA STARSHIP PALETTE >>>` block into this
# file at runtime, writing through the symlink, so expect this file to show up
# as modified after a theme change. That churn is the price of a prompt that
# follows the theme; the alternative was a fixed palette in
# `programs.starship.settings`.
#
# Do not hand-edit anything between the palette markers — it is regenerated.

format = '''
$directory$git_branch
$character'''

# >>> NOCTALIA STARSHIP PALETTE >>>
# Noctalia Starship Palette
# Generated by Noctalia - do not edit manually

[palettes.noctalia]
# Standard colors
blue      = "#81a1c1"
red       = "#bf616a"
green     = "#a3be8c"
yellow    = "#ebcb8b"
cyan      = "#88c0d0"
magenta   = "#b48ead"
white     = "#e5e9f0"
black     = "#3b4252"

# Extended palette (Catppuccin-compatible names)
rosewater = "#ebcb8b"
flamingo  = "#bf616a"
pink      = "#b48ead"
mauve     = "#b48ead"
maroon    = "#bf616a"
peach     = "#ebcb8b"
teal      = "#88c0d0"
sky       = "#8fbcbb"
sapphire  = "#81a1c1"
lavender  = "#b48ead"

# Text shades
text      = "#d8dee9"
subtext1  = "#e5e9f0"
subtext0  = "#596377"

# Surface shades
overlay2  = "#596377"
overlay1  = "#596377"
overlay0  = "#3b4252"
surface2  = "#3b4252"
surface1  = "#3b4252"
surface0  = "#2e3440"
base      = "#2e3440"
mantle    = "#2e3440"
crust     = "#2e3440"
# <<< NOCTALIA STARSHIP PALETTE <<<
