confirm_os_window_close 0
background_opacity 0.9
background_blur 32

# noctalia writes themes/noctalia.conf and keeps this include line present. Its
# templates/kitty/apply.sh rewrites the whole file and does so *through* the
# symlink deliberately, so leaving the line out does not avoid the write — it
# just means the first theme change rewrites a tracked file. Authored here so
# that rewrite is a no-op.
include themes/noctalia.conf
